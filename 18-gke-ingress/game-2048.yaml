# GKE version of the classic "2048" sample app (AWS uses it in its ALB controller examples).
# Uses the built-in GKE Ingress controller -> creates a Google Cloud external Application Load Balancer.
#
# kubectl apply -f game-2048.yaml
# kubectl get ingress -n game-2048 -w      # wait for ADDRESS (5-10 min)
# open http://<ADDRESS>
apiVersion: v1
kind: Namespace
metadata:
  name: game-2048
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: game-2048
  name: deployment-2048
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: app-2048
  template:
    metadata:
      labels:
        app.kubernetes.io/name: app-2048
    spec:
      containers:
      - name: app-2048
        image: public.ecr.aws/l6m2t8p7/docker-2048:latest
        ports:
        - containerPort: 80
        readinessProbe:            # the load balancer health check follows this
          httpGet:
            path: /
            port: 80
---
apiVersion: v1
kind: Service
metadata:
  namespace: game-2048
  name: service-2048
  annotations:
    cloud.google.com/neg: '{"ingress": true}'   # container-native LB (default on VPC-native clusters; explicit here)
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: app-2048
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: game-2048
  name: ingress-2048
  annotations:
    kubernetes.io/ingress.class: "gce"          # external Application Load Balancer ("gce-internal" = internal)
spec:
  defaultBackend:
    service:
      name: service-2048
      port:
        number: 80
